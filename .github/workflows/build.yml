name: Build

on: [push]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - run: cmake -S . -B build
      - run: cmake --build build --config Debug
      - run: ctest --test-dir build -C Debug --output-on-failure